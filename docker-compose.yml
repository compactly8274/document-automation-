services:
  homedocs:
    image: ghcr.io/compactly8274/document-automation:latest
    container_name: homedocs
    restart: unless-stopped
    volumes:
      - ./config:/config:ro
      - ./output:/output
      # Local Docker socket — used for whichever host this stack runs on.
      # On Unraid this gives direct access without needing a socket proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # UNRAID: use the mounted local socket since this stack runs on Unraid.
      # Change to tcp://192.168.1.104:2375 if you prefer the socket proxy instead.
      - UNRAID_SOCKET_URL=${UNRAID_SOCKET_URL:-unix:///var/run/docker.sock}
      # TRUENAS: TCP via Tecnativa docker-socket-proxy (CONTAINERS=1 IMAGES=1 EVENTS=1)
      - TRUENAS_SOCKET_URL=${TRUENAS_SOCKET_URL:-tcp://192.168.1.122:2375}
      - DOMAIN=${DOMAIN:-pancakefarts.xyz}
      - OUTPUT_DIR=/output
      - CONFIG_DIR=/config
      - REGENERATE_ON_START=${REGENERATE_ON_START:-true}
      - DEBOUNCE_SECONDS=${DEBOUNCE_SECONDS:-10}
      - REGEN_INTERVAL=${REGEN_INTERVAL:-3600}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - homedocs_net

networks:
  homedocs_net:
    driver: bridge
